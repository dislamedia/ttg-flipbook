<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To The Good: Donor and Nonprofit Partnerships</title>
<meta name="description" content="Flip through To The Good's prospectus: how Steve Filosa partners with donors and nonprofits on strategic planning, board development and fundraising.">
<style>
  :root { --navy:#0E283F; --ink:#1b2430; --paper:#f4f2ee; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; color:var(--ink); }
  .wrap { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; gap:14px; }
  .stage { position:relative; width:100%; max-width:1100px; }
  #book { margin:0 auto; box-shadow:0 18px 40px rgba(14,40,63,.25), 0 2px 6px rgba(14,40,63,.15); }
  .page { background:#fff; }
  .page img { width:100%; height:100%; display:block; object-fit:contain; user-select:none; -webkit-user-drag:none; }
  .bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; }
  button, a.btn { appearance:none; border:1px solid var(--navy); background:#fff; color:var(--navy); font:600 14px/1 inherit; font-family:inherit; padding:10px 16px; border-radius:999px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  button:hover, a.btn:hover { background:var(--navy); color:#fff; }
  button:disabled { opacity:.35; cursor:default; background:#fff; color:var(--navy); }
  .count { min-width:90px; text-align:center; font-size:14px; color:var(--navy); font-variant-numeric:tabular-nums; }
  .hint { font-size:12px; color:#6b7480; }
  .arrow { position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px; padding:0; justify-content:center; border-radius:50%; font-size:20px; z-index:5; background:rgba(255,255,255,.9); }
  .arrow.prev { left:-6px; } .arrow.next { right:-6px; }
  @media (max-width:700px){ .arrow{ display:none; } }
  html.embedded, html.embedded body { background:transparent; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>
<main class="wrap">
  <h1 class="sr">To The Good: Donor and Nonprofit Partnerships</h1>
  <div class="stage">
    <button class="arrow prev" id="prev2" aria-label="Previous page">&#8249;</button>
    <div id="book" aria-label="To The Good prospectus, use the arrow buttons or keys to turn pages"></div>
    <button class="arrow next" id="next2" aria-label="Next page">&#8250;</button>
  </div>
  <div class="bar">
    <button id="prev" aria-label="Previous page">&#8249; Back</button>
    <span class="count" id="count" aria-live="polite">1 / 7</span>
    <button id="next" aria-label="Next page">Next &#8250;</button>
    <button id="fs" aria-label="Full screen">Full screen</button>
    <a class="btn" href="To-The-Good-Prospectus.pdf" download>Download PDF</a>
  </div>
  <div class="hint">Click a page corner, swipe, or use your arrow keys to turn pages.</div>
</main>

<script src="page-flip.browser.js"></script>
<script>
  // Blend into the host page when embedded on tothegood.net.
  if (window.self !== window.top) document.documentElement.classList.add('embedded');
  // Page images rendered from Steve's print PDF (Choice Graphics, 11/16/2026).
  // The print PDF is 7 spreads of a 5 x 7 inch booklet; each spread is split into its two pages.
  var SPREADS = [
    "Cover: To the Good, Donor and Nonprofit Partnerships",
    "Donor and Nonprofit Partnerships, a letter from Steve Filosa",
    "Donor Clients",
    "Nonprofit Clients",
    "Pro Bono Clients",
    "Connect with Steve",
    "Back cover: To the Good, 580 Washington Street, Boston, MA 02111"
  ];
  var book = document.getElementById('book');
  var PHONE = window.innerWidth < 700;
  var list = [];
  for (var n=1; n<=SPREADS.length*2; n++){
    list.push(['pages/leaf-'+(n<10?'0':'')+n+'.jpg', SPREADS[Math.floor((n-1)/2)]+(n%2===0?' (continued)':'')]);
  }
  if (PHONE) {
    // On phones the cover and back cover show whole, since they are designed across both halves.
    list = [['pages/mobile-cover.jpg', SPREADS[0]]].concat(list.slice(2, -2), [['pages/mobile-back.jpg', SPREADS[SPREADS.length-1]]]);
  }
  list.forEach(function(p){
    var d=document.createElement('div'); d.className='page';
    var i=document.createElement('img'); i.src=p[0]; i.alt=p[1];
    d.appendChild(i); book.appendChild(d);
  });

  // Two-page spreads on wide screens, one page at a time on phones.
  var pf = new St.PageFlip(book, {
    width: 500, height: 700, size: 'stretch',
    minWidth: 240, maxWidth: 560, minHeight: 336, maxHeight: 784,
    usePortrait: true, showCover: false, maxShadowOpacity: 0.45,
    mobileScrollSupport: true, flippingTime: 800, autoSize: true
  });
  pf.loadFromHTML(book.querySelectorAll('.page'));

  var count=document.getElementById('count');
  function sync(){
    var i=pf.getCurrentPageIndex(), n=pf.getPageCount();
    var land = pf.getOrientation && pf.getOrientation()==='landscape';
    count.textContent = land ? ('Spread '+(Math.floor(i/2)+1)+' / '+(n/2)) : ('Page '+(i+1)+' / '+n);
    ['prev','prev2'].forEach(function(id){document.getElementById(id).disabled = i<=0;});
    ['next','next2'].forEach(function(id){document.getElementById(id).disabled = land ? i>=n-2 : i>=n-1;});
  }
  pf.on('flip', sync); pf.on('changeOrientation', sync); sync();
  ['prev','prev2'].forEach(function(id){document.getElementById(id).onclick=function(){pf.flipPrev();};});
  ['next','next2'].forEach(function(id){document.getElementById(id).onclick=function(){pf.flipNext();};});
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight') pf.flipNext();
    if(e.key==='ArrowLeft') pf.flipPrev();
  });
  document.getElementById('fs').onclick=function(){
    var el=document.documentElement;
    if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen).call(el); }
    else { document.exitFullscreen(); }
  };
</script>
<!-- Page-turn engine: StPageFlip 2.0.7 (MIT license) by Nodlik, https://github.com/Nodlik/StPageFlip -->
</body>
</html>
